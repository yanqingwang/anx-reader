name: Build Desktop

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'wk/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      target:
        description: 要构建的目标平台（留空则全部）
        required: false
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows-x64
          - linux-x86_64
          - linux-aarch64-experimental

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 每个平台一个 job；workflow_dispatch 时用 inputs.target 选择
  build-macos-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-arm64'
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frb codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0

      - name: Get Flutter deps & generate Dart code
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate flutter_rust_bridge bindings
        run: |
          flutter_rust_bridge_codegen generate \
            --rust-input crate::api \
            --rust-root rust_core \
            --rust-output rust_core/src/frb_generated.rs \
            --dart-output lib/rust \
            --c-output rust_core/native/frb_generated.h

      - name: Build Rust native library (aarch64)
        run: cargo build --release --manifest-path rust_core/Cargo.toml --target aarch64-apple-darwin

      - name: Build macOS app (arm64)
        run: flutter build macos --release --target-platform darwin-arm64

      - name: Copy Rust dylib into .app bundle
        run: |
          DYLIB=rust_core/target/aarch64-apple-darwin/release/libanx_rust_core.dylib
          APP_DIR=build/macos/Build/Products/Release/anx_reader.app
          # 1) Frameworks：Apple 生态标准位置（loader 找不到默认路径时 fallback）
          mkdir -p "$APP_DIR/Contents/Frameworks"
          cp "$DYLIB" "$APP_DIR/Contents/Frameworks/"
          # 2) frb 默认 loader 路径（相对于可执行文件 Contents/MacOS/anx_reader）
          mkdir -p "$APP_DIR/Contents/MacOS/rust_core/target/release"
          cp "$DYLIB" "$APP_DIR/Contents/MacOS/rust_core/target/release/"

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/anx_reader.app

      - name: Package .app into zip
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          zip -r "anx-reader-${VERSION}-macos-arm64.zip" build/macos/Build/Products/Release/anx_reader.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anx-reader-macos-arm64
          path: anx-reader-*-macos-arm64.zip

  build-macos-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-x64'
    name: macOS x64 (Intel)
    runs-on: macos-13  # 最后一个 Intel macOS runner
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install frb codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0

      - name: Get Flutter deps & generate Dart code
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate flutter_rust_bridge bindings
        run: |
          flutter_rust_bridge_codegen generate \
            --rust-input crate::api \
            --rust-root rust_core \
            --rust-output rust_core/src/frb_generated.rs \
            --dart-output lib/rust \
            --c-output rust_core/native/frb_generated.h

      - name: Build Rust native library (x86_64)
        run: cargo build --release --manifest-path rust_core/Cargo.toml --target x86_64-apple-darwin

      - name: Build macOS app (x64)
        run: flutter build macos --release --target-platform darwin-x64

      - name: Copy Rust dylib into .app bundle
        run: |
          DYLIB=rust_core/target/x86_64-apple-darwin/release/libanx_rust_core.dylib
          APP_DIR=build/macos/Build/Products/Release/anx_reader.app
          mkdir -p "$APP_DIR/Contents/Frameworks"
          cp "$DYLIB" "$APP_DIR/Contents/Frameworks/"
          mkdir -p "$APP_DIR/Contents/MacOS/rust_core/target/release"
          cp "$DYLIB" "$APP_DIR/Contents/MacOS/rust_core/target/release/"

      - name: Ad-hoc codesign
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/anx_reader.app

      - name: Package .app into zip
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          zip -r "anx-reader-${VERSION}-macos-x64.zip" build/macos/Build/Products/Release/anx_reader.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anx-reader-macos-x64
          path: anx-reader-*-macos-x64.zip

  build-windows-x64:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows-x64'
    name: Windows x64 (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Flutter version
        id: flutter_version
        shell: pwsh
        run: Write-Output "version=$((Get-Content .github/flutter_version) -replace '\s','')" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frb codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0

      - name: Get Flutter deps & generate Dart code
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate flutter_rust_bridge bindings
        run: |
          flutter_rust_bridge_codegen generate \
            --rust-input crate::api \
            --rust-root rust_core \
            --rust-output rust_core/src/frb_generated.rs \
            --dart-output lib/rust \
            --c-output rust_core/native/frb_generated.h

      - name: Build Rust native library (x64)
        run: cargo build --release --manifest-path rust_core/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build Windows runner
        run: flutter build windows --release

      - name: Copy Rust dll next to exe
        shell: pwsh
        run: |
          $dll = "rust_core\target\x86_64-pc-windows-msvc\release\anx_rust_core.dll"
          $exeDir = Get-ChildItem -Path build\windows\x64\runner\Release -Filter *.exe -Recurse | Select-Object -First 1 -ExpandProperty DirectoryName
          Copy-Item $dll $exeDir
          # frb 默认路径兼容
          New-Item -ItemType Directory -Path "$exeDir\rust_core\target\release" -Force | Out-Null
          Copy-Item $dll "$exeDir\rust_core\target\release\"

      - name: Package into zip
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:' | ForEach-Object { ($_ -split '\s+')[1] }).Split('+')[0]
          $exeDir = Get-ChildItem -Path build\windows\x64\runner\Release -Filter *.exe -Recurse | Select-Object -First 1 -ExpandProperty DirectoryName
          Compress-Archive -Path "$exeDir\*" -DestinationPath "anx-reader-$version-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anx-reader-windows-x64
          path: anx-reader-*-windows-x64.zip

  build-linux-x86_64:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux-x86_64'
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Read Flutter version
        id: flutter_version
        run: echo "version=$(tr -d '[:space:]' < .github/flutter-version)" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install frb codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0

      - name: Get Flutter deps & generate Dart code
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate flutter_rust_bridge bindings
        run: |
          flutter_rust_bridge_codegen generate \
            --rust-input crate::api \
            --rust-root rust_core \
            --rust-output rust_core/src/frb_generated.rs \
            --dart-output lib/rust \
            --c-output rust_core/native/frb_generated.h

      - name: Build Rust native library (x86_64)
        run: cargo build --release --manifest-path rust_core/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Build Linux runner
        run: flutter build linux --release

      - name: Copy Rust .so next to binary
        run: |
          SO=rust_core/target/x86_64-unknown-linux-gnu/release/libanx_rust_core.so
          BIN_DIR=build/linux/x64/release/bundle
          cp "$SO" "$BIN_DIR/"
          # frb 默认路径兼容
          mkdir -p "$BIN_DIR/rust_core/target/release"
          cp "$SO" "$BIN_DIR/rust_core/target/release/"

      - name: Package into tar.gz
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cd build/linux/x64/release/bundle
          tar czf "../../../anx-reader-${VERSION}-linux-x86_64.tar.gz" .
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anx-reader-linux-x86_64
          path: anx-reader-*-linux-x86_64.tar.gz

  # Linux aarch64（ARM 服务器/树莓派等）— experimental：Flutter aarch64 Linux desktop 仍在完善中
  # 如果 flutter build linux --target-platform linux-arm64 在未来某个版本失败，降级为仅产出 Rust .so。
  build-linux-aarch64:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux-aarch64-experimental'
    name: Linux aarch64 (experimental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install QEMU for aarch64 Rust build
        run: |
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Set up Rust + cross crate
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: cargo install cross --version 0.2.5

      - name: Flutter deps + codegen + frb bindings
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter_rust_bridge_codegen generate \
            --rust-input crate::api \
            --rust-root rust_core \
            --rust-output rust_core/src/frb_generated.rs \
            --dart-output lib/rust \
            --c-output rust_core/native/frb_generated.h

      # Rust 侧用 cross（docker + qemu）交叉编译到 aarch64
      - name: Build Rust native library (aarch64) via cross
        run: cross build --release --manifest-path rust_core/Cargo.toml --target aarch64-unknown-linux-gnu

      # Flutter 侧尝试交叉构建 aarch64；失败时降级为打包 Rust .so
      - name: Try flutter build linux aarch64 (best-effort)
        id: flutter_build
        continue-on-error: true
        run: flutter build linux --release --target-platform linux-arm64

      - name: Collect Rust .so
        run: |
          mkdir -p build/linux-aarch64/rust_core/target/release
          cp rust_core/target/aarch64-unknown-linux-gnu/release/libanx_rust_core.so \
             build/linux-aarch64/rust_core/target/release/
          cp rust_core/target/aarch64-unknown-linux-gnu/release/libanx_rust_core.so \
             build/linux-aarch64/

      - name: Package (Flutter build succeeded)
        if: steps.flutter_build.outcome == 'success'
        run: |
          BUNDLE=build/linux-arm64/release/bundle
          cp build/linux-aarch64/rust_core/target/release/libanx_rust_core.so "$BUNDLE/"
          cp -r build/linux-aarch64/rust_core "$BUNDLE/"
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cd "$BUNDLE" && tar czf "../../../anx-reader-${VERSION}-linux-aarch64.tar.gz" . && cd ../../..

      - name: Package (Rust-only fallback)
        if: steps.flutter_build.outcome != 'success'
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          cd build/linux-aarch64 && tar czf "../anx-reader-${VERSION}-linux-aarch64-rustonly.tar.gz" . && cd ../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anx-reader-linux-aarch64
          path: anx-reader-*-linux-aarch64*.tar.gz
